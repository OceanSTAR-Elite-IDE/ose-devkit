@if(filter) {
  <div class="nc-pseudo-input only-caret">
    <input
      class="nc-select-input"
      [disabled]="disabled"
      [placeholder]="placeholder"
      [style.margin.px]="0"
      [value]="focused && overlay.opened ? '' : displayValue"
      (blur)="_onInputBlur()"
      (focus)="_onInputFocus($event)"
      (keyup)="_onSearch($event)"
      #inputElement
      type="text" />
      @if(!clearable) {
        <nc-pseudo-caret>
          <span [class]="icons.caret"></span>
        </nc-pseudo-caret>
      } @else {
        <ng-container *ngTemplateOutlet="clearCaret"></ng-container>
      }
  </div>
} @else {
  <nc-pseudo-input
    [attr.tabindex]="tabIndex"
    [disabled]="disabled"
    [placeholder]="placeholder"
    [style.margin.px]="0"
    [value]="displayType === 'content' ? displayContent : displayValue"
    (click)="_onInputClick($event)">
    @if(!clearable) {
    <nc-pseudo-caret>
      <span [class]="icons.caret"></span>
    </nc-pseudo-caret>
    } @else {
      <ng-container *ngTemplateOutlet="clearCaret"></ng-container>
    }
  </nc-pseudo-input>
}
<nc-overlay
  [origin]="origin"
  [positionPairs]="_positionPairs"
  (afterClosed)="_afterClosed($event)"
  (afterOpen)="_afterOpen($event)"
  (beforeClosed)="_beforeClosed($event)"
  (beforeOpen)="_beforeOpen($event)"
  (keydownEvents)="_handleKeydown($event)"
  (positionChange)="_positionChange($event)"
  overlayClass="nc-select-overlay">
  <div class="nc-select-pane" [class.folded]="state === 'folded'" [style.width.px]="width" #paneElement>
    <ng-content select="nc-option"></ng-content>
    <div class="nc-select-not-found" [hidden]="!optionEmpty">{{ filterNotFound }}</div>
  </div>
</nc-overlay>

<ng-template #clearCaret>
  @if(!hasSelectedValue) {
    <nc-pseudo-caret>
      <span [class]="icons.caret"></span>
    </nc-pseudo-caret>
  } @else if(!disabled) {
    <nc-pseudo-caret class="nc-select-clear" (click)="_onClear($event)">
      <span [class]="icons.clear"></span>
    </nc-pseudo-caret>
  }
</ng-template>
